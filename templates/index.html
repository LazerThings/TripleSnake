<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripleSnake - 3 Player Snake Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="app">
        <!-- Main Menu -->
        <div id="menu" class="screen active">
            <h1>TripleSnake</h1>
            <p class="subtitle">3-Player Multiplayer Snake</p>
            <div class="menu-buttons">
                <button id="createLobbyBtn" class="btn btn-primary">Create Lobby</button>
                <button id="joinLobbyBtn" class="btn btn-secondary">Join Lobby</button>
            </div>
        </div>

        <!-- Create Lobby Screen -->
        <div id="createScreen" class="screen">
            <h2>Create Lobby</h2>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="createUsername" maxlength="15" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Choose Color:</label>
                <div id="createColorPicker" class="color-picker"></div>
            </div>
            <div class="button-group">
                <button id="confirmCreateBtn" class="btn btn-primary">Create</button>
                <button id="backFromCreateBtn" class="btn btn-secondary">Back</button>
            </div>
        </div>

        <!-- Join Lobby Screen -->
        <div id="joinScreen" class="screen">
            <h2>Join Lobby</h2>
            <div class="form-group">
                <label>Lobby Code:</label>
                <input type="text" id="joinCode" maxlength="7" placeholder="7-digit code">
            </div>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="joinUsername" maxlength="15" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Choose Color:</label>
                <div id="joinColorPicker" class="color-picker"></div>
            </div>
            <div class="button-group">
                <button id="confirmJoinBtn" class="btn btn-primary">Join</button>
                <button id="backFromJoinBtn" class="btn btn-secondary">Back</button>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobbyScreen" class="screen">
            <h2>Lobby</h2>
            <div class="lobby-code">
                <span>Join Code: <strong id="lobbyCode">-------</strong></span>
            </div>
            <div class="players-list">
                <h3>Players:</h3>
                <div id="playersList"></div>
            </div>
            <div class="button-group">
                <button id="startGameBtn" class="btn btn-primary" style="display: none;">Start Game</button>
                <button id="leaveLobbyBtn" class="btn btn-secondary">Leave Lobby</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div id="scoreBoard" class="score-board"></div>
            </div>
            <canvas id="gameCanvas" width="800" height="800"></canvas>
            <div class="game-controls">
                <p>Use arrow keys or WASD to control your snake</p>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen">
            <h2>Game Over!</h2>
            <p id="winnerText" class="winner-text"></p>
            <button id="backToMenuBtn" class="btn btn-primary">Back to Menu</button>
        </div>

        <!-- Error/Info Messages -->
        <div id="messageBox" class="message-box"></div>
    </div>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
